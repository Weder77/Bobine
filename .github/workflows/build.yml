name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (tests + build)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Compilation Windows (release)
        run: flutter build windows --release

      - name: Archive
        shell: pwsh
        run: |
          $out = "Lumen-windows-x64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $out
          Get-Item $out | Select-Object Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: Lumen-windows-x64
          path: Lumen-windows-x64.zip
          retention-days: 30

      - name: Publication (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Lumen-windows-x64.zip
