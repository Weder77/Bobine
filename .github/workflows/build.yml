name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
    # Documentation alone does not need a Windows build (minutes count double).
    paths-ignore: ['**.md', 'docs/**', 'tool/fake_xtream.py']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'tool/fake_xtream.py']
  workflow_dispatch:

permissions:
  contents: write

# A newer push on the same branch replaces the build in progress (tags always finish).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows (tests + build)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Compilation Windows (release)
        run: flutter build windows --release

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          "value=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $v) { throw "Le tag v$tag ne correspond pas à la version $v de pubspec.yaml" }
          }
          Write-Host "Lumen $v"

      - name: Archive
        shell: pwsh
        run: |
          $out = "Lumen-windows-x64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $out
          Get-Item $out | Select-Object Name, Length

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=$PWD\build\windows\x64\runner\Release" windows\installer\lumen.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué ($LASTEXITCODE)" }
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: Lumen-windows-x64
          path: Lumen-windows-x64.zip
          retention-days: 30

      - uses: actions/upload-artifact@v5
        with:
          name: Lumen-Setup
          path: dist/Lumen-Setup-*.exe
          retention-days: 30

      - name: Publication (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Lumen-windows-x64.zip
            dist/Lumen-Setup-*.exe
