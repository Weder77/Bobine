name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
    # Documentation alone does not need a Windows build (minutes count double).
    paths-ignore: ['**.md', 'docs/**', 'tool/fake_xtream.py']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'tool/fake_xtream.py']
  workflow_dispatch:

permissions:
  contents: write

# A newer push on the same branch replaces the build in progress (tags always finish).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows (tests + build)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Compilation Windows (release)
        run: flutter build windows --release

      # Petit programme autonome pour tester le cast sur une télé DLNA.
      - name: Outil de test du cast
        run: dart compile exe tool/cast_test.dart -o bobine-test-cast.exe

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          "value=$v" >> $env:GITHUB_OUTPUT
          $release = $false
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $v) { throw "Le tag v$tag ne correspond pas à la version $v de pubspec.yaml" }
            $release = $true
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -eq 'push') {
            # A version not yet published, merged into main: release it.
            gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
            $release = ($LASTEXITCODE -ne 0)
          }
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Bobine $v, publication : $release"
          exit 0

      - name: Archive
        shell: pwsh
        run: |
          $out = "Bobine-windows-x64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $out
          Get-Item $out | Select-Object Name, Length

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=$PWD\build\windows\x64\runner\Release" windows\installer\bobine.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué ($LASTEXITCODE)" }
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v5
        with:
          name: Bobine-windows-x64
          path: Bobine-windows-x64.zip
          retention-days: 30

      - uses: actions/upload-artifact@v5
        with:
          name: Bobine-Setup
          path: dist/Bobine-Setup-*.exe
          retention-days: 30

      - uses: actions/upload-artifact@v5
        with:
          name: Bobine-test-cast
          path: bobine-test-cast.exe
          retention-days: 30

      # Tag v* pushed, or new version merged into main (the tag is then created here).
      - name: Publication de la Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Bobine ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            Bobine-windows-x64.zip
            dist/Bobine-Setup-*.exe
