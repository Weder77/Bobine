name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
    # Documentation alone does not need a Windows build (minutes count double).
    paths-ignore: ['**.md', 'docs/**', 'tool/fake_xtream.py']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'tool/fake_xtream.py']
  workflow_dispatch:

# Read-only by default: only the publishing job, which runs no third-party
# build step, may write to the repository (releases).
permissions:
  contents: read

# A newer push on the same branch replaces the build in progress (tags always finish).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows (tests + build)
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.value }}
    # Actions pinned by commit: a moved tag cannot change what builds the
    # installer the app then offers and runs.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Compilation Windows (release)
        run: flutter build windows --release

      # Petit programme autonome pour tester le cast sur une télé DLNA.
      - name: Outil de test du cast
        run: dart compile exe tool/cast_test.dart -o bobine-test-cast.exe

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          "value=$v" >> $env:GITHUB_OUTPUT
          $release = $false
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $v) { throw "Le tag v$tag ne correspond pas à la version $v de pubspec.yaml" }
            $release = $true
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -eq 'push') {
            # A version not yet published, merged into main: release it.
            gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
            $release = ($LASTEXITCODE -ne 0)
          }
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Bobine $v, publication : $release"
          exit 0

      - name: Archive
        shell: pwsh
        run: |
          $out = "Bobine-windows-x64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $out
          Get-Item $out | Select-Object Name, Length

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            # Fixed version: what builds the installer does not change by itself.
            choco install innosetup --version=6.7.1 -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" "/DSourceDir=$PWD\build\windows\x64\runner\Release" windows\installer\bobine.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué ($LASTEXITCODE)" }
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Bobine-windows-x64
          path: Bobine-windows-x64.zip
          retention-days: 30

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Bobine-Setup
          path: dist/Bobine-Setup-*.exe
          retention-days: 30

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Bobine-test-cast
          path: bobine-test-cast.exe
          retention-days: 30

  # Tag v* pushed, or new version merged into main (the tag is then created here).
  release:
    name: Publication de la Release
    needs: windows
    if: needs.windows.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: Bobine-windows-x64

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: Bobine-Setup
          path: dist

      # Signature of the installer, checked by the app before it installs an
      # update (see docs/signature-mises-a-jour.md). Without the secret, the
      # release is published unsigned, as before.
      - name: Signature de l'installateur
        env:
          SIGNING_KEY: ${{ secrets.BOBINE_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "Pas de clé de signature : installateur non signé."
            exit 0
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          for f in dist/Bobine-Setup-*.exe; do
            openssl dgst -sha256 -binary "$f" > "$RUNNER_TEMP/digest.bin"
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in "$RUNNER_TEMP/digest.bin" -out "$f.sig"
          done
          rm -f "$RUNNER_TEMP/key.pem"
          ls -l dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          name: Bobine ${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            Bobine-windows-x64.zip
            dist/Bobine-Setup-*.exe
            dist/Bobine-Setup-*.exe.sig
