name: Site

# The showcase site and account pages (site/): tested and built on every
# change to it, to the key vectors it shares with the app, or to what it shows
# from docs/ (privacy policy, screenshots, icon).
on:
  push:
    branches: ['**']
    paths: ['site/**', 'test/fixtures/sync_key_vectors.json', 'docs/**', 'assets/fonts/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'test/fixtures/sync_key_vectors.json', 'docs/**', 'assets/fonts/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The runner's own Node (22 or later): no third-party action for it.
      - run: node --version
      - run: npm ci --no-fund --no-audit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
